# =============================================================================
# Secret for Line Shop Runner Service
# IMPORTANT: Replace placeholder values before applying
# Consider using external secret management (Vault, AWS Secrets Manager, etc.)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: line-shop-runner-secrets
  namespace: line-shop
  labels:
    app.kubernetes.io/name: line-shop-runner
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # API Key(s) for authentication - REQUIRED
  # Generate with: openssl rand -hex 32
  # Multiple keys can be comma-separated for key rotation
  API_KEY: "REPLACE_WITH_SECURE_API_KEY"
  
  # CORS origin (specific domain for production)
  CORS_ORIGIN: "https://your-domain.com"
  
  # GCS credentials (if using Google Cloud Storage)
  # GCS_KEY_FILE: "/app/secrets/gcs-key.json"
  
  # LINE Messaging API (optional)
  # LINE_CHANNEL_ACCESS_TOKEN: "your-line-access-token"
  # LINE_CHANNEL_SECRET: "your-line-channel-secret"

---
# =============================================================================
# Secret for GCS Service Account Key (if using GCS)
# =============================================================================
# apiVersion: v1
# kind: Secret
# metadata:
#   name: gcs-credentials
#   namespace: line-shop
