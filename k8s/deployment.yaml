# =============================================================================
# Deployment for Line Shop Runner Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: line-shop-runner
  namespace: line-shop
  labels:
    app.kubernetes.io/name: line-shop-runner
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: line-shop-runner
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: line-shop-runner
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      
      # Service account (create if needed for GCS access)
      # serviceAccountName: line-shop-runner-sa
      
      # Termination grace period (should be > shutdown timeout)
      terminationGracePeriodSeconds: 330
      
      containers:
        - name: line-shop-runner
          image: line-shop-runner-service:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          
          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: line-shop-runner-config
          
          # Environment variables from Secret
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: line-shop-runner-secrets
                  key: API_KEY
            - name: CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: line-shop-runner-secrets
                  key: CORS_ORIGIN
                  optional: true
          
          # Resource limits and requests
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          
          # Liveness probe - is the container alive?
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Readiness probe - is the container ready to receive traffic?
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          # Startup probe - for slow-starting containers
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          
          # Security context for the container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Puppeteer needs write access
            capabilities:
              drop:
                - ALL
          
          # Volume mounts
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: screenshots
              mountPath: /app/screenshots
            - name: tmp
              mountPath: /tmp
            # Uncomment if using GCS
            # - name: gcs-credentials
            #   mountPath: /app/secrets
            #   readOnly: true
      
      # Volumes
      volumes:
        - name: logs
          emptyDir: {}
        - name: screenshots
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # Uncomment if using GCS
        # - name: gcs-credentials
        #   secret:
        #     secretName: gcs-credentials
      
      # Node affinity (optional - for specific node pools)
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: cloud.google.com/gke-nodepool
      #               operator: In
      #               values:
      #                 - crawler-pool
      
      # Tolerations (optional - for dedicated nodes)
      # tolerations:
      #   - key: "crawler"
      #     operator: "Equal"
      #     value: "true"
      #     effect: "NoSchedule"
